name: Build SoulTalk AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SoulTalk project
        run: |
          unzip -o SoulTalk_FINAL_READY_v41.zip
          ls -la
          ls -la SoulTalk_v30/SoulTalk_v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build AAB
        run: |
          gradle -p SoulTalk_v30/SoulTalk_v3 bundleRelease \
            -PSOULTALK_API_BASE=https://example.com

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SoulTalk-AAB
          path: SoulTalk_v30/SoulTalk_v3/app/build/outputs/bundle/release/*.aab
